services:
  postgres:
    image: postgres:17
    container_name: argos-postgres
    restart: unless-stopped
    env_file:
      - ArgosSharp.Api/.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio
    container_name: argos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  floci:
    image: floci/floci:latest
    container_name: argos-floci-cloud
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - floci_data:/app/data

volumes:
  postgres_data:
  minio_data:
  floci_data:
